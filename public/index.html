<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Ghostline</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#F7FAFE" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #F7FAFE;
        color: #0B1B33;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
      }
      .shell-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        text-align: center;
        animation: fadeIn 0.4s ease-out;
      }
      .logo-icon {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 10px 25px -5px rgba(37, 135, 245, 0.25);
      }
      .app-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: #0B1B33;
      }
      .spinner {
        width: 24px;
        height: 24px;
        border: 2.5px solid #EAF4FF;
        border-top-color: #2587F5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 8px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div class="shell-container">
      <img src="/icon-192.png" alt="Ghostline" class="logo-icon" />
      <h1 class="app-title">Ghostline</h1>
      <div class="spinner"></div>
    </div>
  </body>
</html>
